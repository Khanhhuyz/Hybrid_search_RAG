# 8. Evaluation workflow

```text
Evaluation Dataset
       │
       ├── Questions
       ├── Expected answers
       ├── Expected entities
       ├── Expected relationships
       ├── Relevant chunks
       └── Expected graph paths
       │
       ▼
Chạy GraphRAG
       │
       ▼
Thu thập kết quả
       │
       ├── Retrieved entities
       ├── Retrieved relationships
       ├── Retrieved chunks
       ├── Retrieved subgraph
       └── Generated answer
       │
       ▼
Tính metrics
```

Các metrics:

```text
Entity Extraction:
• Precision
• Recall
• F1

Relationship Extraction:
• Precision
• Recall
• Direction accuracy

Retrieval:
• Hit@k
• Recall@k
• MRR
• Context precision
• Context recall

Generation:
• Answer correctness
• Faithfulness
• Answer relevance
• Citation correctness

System:
• Latency
• Token usage
• Cost
• Error rate
```

---

# 9. Monitoring và Maintenance

GraphRAG không kết thúc sau khi triển khai.

```text
Tài liệu mới
   │
   ▼
Change Detection
   │
   ├── Tài liệu mới
   ├── Tài liệu bị sửa
   └── Tài liệu bị xóa
   │
   ▼
Incremental Indexing
   │
   ├── Re-chunk
   ├── Re-embed
   ├── Re-extract entity
   ├── Re-extract relationship
   └── Update graph
   │
   ▼
Entity Resolution
   │
   ▼
Community Update
   │
   ▼
Regenerate Community Reports
   │
   ▼
Re-evaluation
```

Ngoài ra cần giám sát:

```text
• Chất lượng câu trả lời
• Tỉ lệ không tìm thấy đáp án
• Hallucination
• Retrieval failure
• Entity duplication
• Relationship noise
• Chi phí LLM
• Thời gian phản hồi
• Feedback người dùng
```

