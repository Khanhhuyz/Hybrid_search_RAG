# Sơ đồ workflow hoàn chỉnh của một dự án GraphRAG

Một dự án GraphRAG thực tế thường có **ba luồng chính**:

```text
1. Indexing Pipeline
   Xử lý tài liệu và xây dựng Knowledge Graph

2. Query Pipeline
   Truy xuất dữ liệu và trả lời câu hỏi

3. Evaluation & Maintenance
   Đánh giá, giám sát và cập nhật hệ thống
```

