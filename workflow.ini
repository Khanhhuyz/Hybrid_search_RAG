# 3. Local Search workflow

Local Search dùng cho câu hỏi tập trung vào một hoặc một số entity cụ thể.

Ví dụ:

```text
“Ai quản lý Project Alpha?”
“Project Alpha sử dụng công nghệ nào?”
“Neo4j liên quan thế nào đến dự án Chatbot?”
```

Workflow:

```text
Câu hỏi
   │
   ▼
Nhận diện entity trong câu hỏi
   │
   ▼
Entity Linking
   │
   │ “Alpha” → node Project Alpha
   ▼
Tìm seed node trong Knowledge Graph
   │
   ▼
Graph Traversal
   │
   ├── 1-hop neighbors
   ├── 2-hop neighbors
   ├── Relationship filtering
   └── Path finding
   │
   ▼
Tạo Candidate Subgraph
   │
   ▼
Kết hợp Vector Retrieval
   │
   ├── Tìm chunk tương tự câu hỏi
   └── Tìm chunk nguồn của entity/relationship
   │
   ▼
Candidate Context
   │
   ├── Entities
   ├── Relationships
   ├── Graph paths
   ├── Community reports
   └── Source chunks
   │
   ▼
Scoring & Reranking
   │
   ├── Semantic similarity
   ├── Graph distance
   ├── Relationship importance
   ├── Source reliability
   └── Recency
   │
   ▼
Context Builder
   │
   ▼
Prompt + Context
   │
   ▼
LLM
   │
   ▼
Câu trả lời + Citation
```

Ví dụ subgraph:

```text
Nguyễn Văn An
      │ MANAGES
      ▼
Project Alpha
      │
      ├── USES ───────> Neo4j
      │
      ├── HAS_RISK ───> Chậm tích hợp API
      │
      └── HAS_RISK ───> Thiếu nhân sự Backend
```

---

# 4. Global Search workflow

Global Search dùng cho câu hỏi cần tổng hợp toàn bộ dữ liệu.

Ví dụ:

```text
“Các rủi ro phổ biến nhất của các dự án là gì?”

“Những chủ đề chính trong toàn bộ tài liệu là gì?”

“Công ty đang gặp những vấn đề chung nào?”
```

Workflow:

```text
Câu hỏi toàn cục
       │
       ▼
Phân tích query
       │
       ▼
Chọn Community Level
       │
       ▼
Lấy Community Reports
       │
       ▼
Chia report thành các batch
       │
       ▼
MAP PHASE
       │
       ├── LLM phân tích Batch 1
       ├── LLM phân tích Batch 2
       ├── LLM phân tích Batch 3
       └── ...
       │
       ▼
Intermediate Answers
       │
       ├── Ý chính
       ├── Evidence
       ├── Importance score
       └── Community source
       │
       ▼
Filter & Rank
       │
       ▼
REDUCE PHASE
       │
       ▼
LLM tổng hợp các ý quan trọng
       │
       ▼
Câu trả lời toàn cục
       │
       ▼
Community citations + source documents
```

Sơ đồ Map–Reduce:

```text
Community Reports
   │
   ├── Batch 1 ──> Map ──> Kết quả 1
   ├── Batch 2 ──> Map ──> Kết quả 2
   ├── Batch 3 ──> Map ──> Kết quả 3
   └── Batch 4 ──> Map ──> Kết quả 4
                               │
                               ▼
                        Rank và Filter
                               │
                               ▼
                             Reduce
                               │
                               ▼
                    Câu trả lời tổng hợp
```

---

# 5. Hybrid Search workflow

Hybrid Search kết hợp Vector Search và Graph Search.

```text
                     Câu hỏi
                        │
            ┌───────────┴───────────┐
            │                       │
            ▼                       ▼
     Vector Retrieval         Graph Retrieval
            │                       │
            │                Entity Linking
            │                       │
            │                Graph Traversal
            │                       │
            ▼                       ▼
    Relevant Chunks         Relevant Subgraph
            │                       │
            └───────────┬───────────┘
                        │
                        ▼
               Merge & Deduplicate
                        │
                        ▼
                    Reranker
                        │
                        ▼
                  Context Builder
                        │
                        ▼
                       LLM
                        │
                        ▼
                    Câu trả lời
```

Vector Search trả lời:

```text
Đoạn văn nào giống câu hỏi?
```

Graph Search trả lời:

```text
Những entity và relationship nào liên quan?
```

Kết hợp hai loại giúp hệ thống vừa có:

```text
Ngữ nghĩa từ văn bản
          +
Cấu trúc quan hệ từ graph
```

---

# 6. Context Builder

Sau retrieval, dữ liệu thường chưa thể đưa thẳng vào LLM.

Context Builder thực hiện:

```text
Retrieved entities
Retrieved relationships
Retrieved graph paths
Retrieved chunks
Community reports
        │
        ▼
Loại bỏ dữ liệu trùng
        │
        ▼
Kiểm tra token budget
        │
        ▼
Xếp hạng thông tin
        │
        ▼
Format thành context
        │
        ▼
Đưa vào prompt
```

Ví dụ context:

```text
[Entities]

1. Project Alpha
   Type: Project
   Status: In Progress

2. Nguyễn Văn An
   Type: Person
   Role: Project Manager


[Relationships]

Nguyễn Văn An --MANAGES--> Project Alpha

Project Alpha --USES--> Neo4j

Project Alpha --HAS_RISK--> Chậm tích hợp API


[Evidence]

Document: project_alpha_report.pdf
Page: 12
Chunk: chunk_102

“Dự án Alpha đang có nguy cơ trễ do API ngân hàng
chưa hoàn thành quá trình phê duyệt.”
```

---

# 7. Answer Generation

```text
System Prompt
      +
User Question
      +
Graph Context
      +
Text Evidence
      +
Output Instructions
      │
      ▼
LLM
      │
      ▼
Draft Answer
      │
      ▼
Post-processing
```

Post-processing có thể gồm:

```text
• Kiểm tra trích dẫn
• Loại bỏ câu không có evidence
• Chuẩn hóa format
• Kiểm tra thông tin nhạy cảm
• Kiểm tra câu trả lời có đúng ngôn ngữ không
• Gắn confidence
```

Kết quả:

```text
Project Alpha hiện có hai rủi ro chính:

1. Chậm tích hợp API ngân hàng.
2. Thiếu nhân sự Backend.

Thông tin được ghi nhận trong báo cáo Project Alpha,
trang 12 và trang 18.
```

