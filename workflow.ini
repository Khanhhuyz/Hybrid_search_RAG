# 12. Cách nhớ toàn bộ workflow

```text
Tài liệu
   ↓
Parsing
   ↓
Chunking
   ↓
Embedding ───────────────────────> Vector Database
   ↓
Entity Extraction
   ↓
Relationship Extraction
   ↓
Entity Resolution
   ↓
Knowledge Graph
   ↓
Community Detection
   ↓
Community Reports
   ↓
────────────────────────────────────────────────────
Người dùng đặt câu hỏi
   ↓
Query Classification
   ↓
Local / Global / Hybrid Search
   ↓
Subgraph + Chunks + Community Reports
   ↓
Reranking
   ↓
Context Builder
   ↓
LLM
   ↓
Câu trả lời + bằng chứng
   ↓
Evaluation + Monitoring
```

Điểm cốt lõi của toàn bộ hệ thống là:

```text
Vector Database
= tìm các đoạn văn có ngữ nghĩa liên quan

Knowledge Graph
= tìm entity, relationship và đường liên kết

Community Reports
= cung cấp cái nhìn tổng thể toàn bộ dữ liệu

LLM
= tổng hợp context thành câu trả lời tự nhiên
```

